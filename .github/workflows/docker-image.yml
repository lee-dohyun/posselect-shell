name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # jsdom 기반 plain unit-test 프로젝트(vitest.config.ts의 "unit" project)만 돈다.
      # Storybook 브라우저 프로젝트("storybook")는 과거 flaky로 test-storybook에서 빠졌던
      # 이력이 있어 이 게이트에는 포함하지 않는다(scripts/test는 --project unit으로 한정).
      - name: Test
        run: npm test

      # Report-only: 실패 임계값을 걸지 않는다(vitest coverage thresholds 미설정).
      # 테스트 자체가 실패하면 위 "Test" 스텝에서 이미 잡히므로, 이 스텝은 커버리지
      # 리포트를 만들어 아티팩트로 남기는 역할만 한다.
      - name: Test coverage (report-only)
        run: npm run test:coverage
        continue-on-error: true

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report-${{ github.sha }}
          path: coverage/
          retention-days: 14

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/posselect-shell:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/posselect-shell:${{ github.sha }}

      # DevSecOps SCA rollout (architecture#15 / architecture#17): scan the image we just
      # built/pushed for known OS + npm vulnerabilities. Report-only for now —
      # TODO: once findings are triaged, set exit-code: '1' with
      # severity: 'CRITICAL,HIGH' to actually gate the build/deploy.
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/posselect-shell:${{ github.sha }}
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH,MEDIUM"
          exit-code: "0"

      - name: Upload Trivy scan results as workflow artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-results-${{ github.sha }}
          path: trivy-results.sarif
          retention-days: 30

      - name: Upload Trivy scan results to GitHub Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v4.37.7
        with:
          sarif_file: "trivy-results.sarif"

  deploy:
    needs: build-and-push
    if: github.event_name == 'push'
    runs-on: [self-hosted, k3s-home]

    steps:
      - name: Deploy new image to K3s
        run: |
          /usr/local/bin/kubectl --kubeconfig=/home/leedohyun/.kube-ci/posselect-shell-deployer.kubeconfig \
            set image deployment/posselect-shell posselect-shell=leedohyun1985/posselect-shell:${{ github.sha }} -n default

      - name: Wait for rollout
        run: |
          /usr/local/bin/kubectl --kubeconfig=/home/leedohyun/.kube-ci/posselect-shell-deployer.kubeconfig \
            rollout status deployment/posselect-shell -n default --timeout=300s
