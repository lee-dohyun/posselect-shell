name: GitHub Issue to Project and Redmine Sync Template

# 이 템플릿은 개별 서비스 리포지토리(auth.api, gateway 등)의 .github/workflows/ 위치에 복사하여 사용합니다.
# 수정해야 할 부분:
# 1. secrets.REDMINE_API_KEY 가 깃허브 오가니제이션/리포지토리 시크릿으로 등록되어 있어야 합니다.
# 2. GH_PROJECT_ID (아래 env에 정의)를 실제 발급받은 프로젝트 보드 ID에 맞게 조정하세요. 현재 2로 세팅되어 있습니다.

on:
  issues:
    types: [opened, closed]

env:
  GH_PROJECT_ID: "2"
  GH_PROJECT_OWNER: "lee-dohyun"

jobs:
  sync_to_project_and_redmine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout posselect-shell for scripts
        uses: actions/checkout@v3
        with:
          repository: lee-dohyun/posselect-shell
          path: posselect-shell

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests

      - name: Link Issue to GitHub Project (On Open)
        if: github.event.action == 'opened'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 새로 생성된 이슈를 깃허브 프로젝트 보드에 추가합니다.
          # 주의: 현재 리포지토리에 권한이 있는 GITHUB_TOKEN 필요
          gh project item-add $GH_PROJECT_ID --owner $GH_PROJECT_OWNER --url ${{ github.event.issue.html_url }} || echo "Project link failed, ignoring"

      - name: Sync Close Status to Redmine
        if: github.event.action == 'closed'
        env:
          REDMINE_API_KEY: ${{ secrets.REDMINE_API_KEY }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
        run: |
          # 파이썬 동기화 스크립트를 호출합니다.
          python posselect-shell/scripts/sync_redmine_issue.py
