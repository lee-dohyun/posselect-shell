# Claude 자동 PR 리뷰
#
# 전제: 저장소(또는 조직) 시크릿에 ANTHROPIC_API_KEY 가 등록되어 있어야 한다.
# 시크릿이 없으면 이 워크플로는 조용히 건너뛴다(아래 if 조건) — PR 자체를 막지는 않는다.
#
# 왜 ubuntu-latest 인가: 이 클러스터의 self-hosted runner(k3s-home)는 배포 전용이며
# 배포용 kubeconfig 에 접근할 수 있다. API 키를 그 러너에 올리면 노출면이 넓어지므로
# 리뷰 잡은 GitHub 호스티드 러너에서 돌린다.
name: Claude Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

concurrency:
  group: claude-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check for API key
        id: guard
        run: |
          if [ -n "${{ secrets.ANTHROPIC_API_KEY }}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ANTHROPIC_API_KEY 시크릿이 없어 Claude 리뷰를 건너뜁니다."
          fi
      - name: Claude review
        if: steps.guard.outputs.enabled == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            PR 변경분을 리뷰하라. 이 저장소는 전 프론트가 런타임 <script> 로 로드하는 공통 헤더/푸터다.
            버전 협상이 없어 배포 즉시 4개 사이트에 동시 반영된다.
            
            우선 확인할 것:
            1. 커스텀 엘리먼트 속성명/엘리먼트명/전역 네임스페이스 변경은 v1 계약 파기다. 소비 저장소가 함께
               재빌드되지 않으므로 즉시 깨진다 — v2 분리가 필요한 변경인지 볼 것.
            2. 반응형 회귀: flex 자식에 min-width: 0 이 빠지면 콘텐츠 폭 이하로 줄지 않아 행이 넘친다.
               과거 이 문제로 아이콘이 뷰포트를 벗어났다. 320/375/768px 에서의 동작을 따져볼 것.
            3. 전역 스코프 오염(새 전역 변수, prototype 패치, document/window 에 스코프 없는 리스너).
            4. 768/480 브레이크포인트는 posselect-ui 와 중복된 리터럴이다 — 한쪽만 바꾸면 갈라진다.
            
            CI 는 typecheck 만 돌고 Storybook 테스트는 flaky 로 제거된 상태다. 확실한 결함만 지적할 것.
          claude_args: --model claude-sonnet-5 --max-turns 15
