server {
    listen 80;
    root /usr/share/nginx/html;

    # nginx:alpine 기본 설정은 Cache-Control을 아예 안 보내서, 브라우저가 자체 휴리스틱으로
    # header.js/footer.js를 예상보다 훨씬 오래 캐싱해버리는 문제가 있었다(실제로 재배포
    # 직후에도 이전 방문에서 캐싱된 번들을 계속 쓰는 현상 확인, 2026-08-13). no-cache로
    # 강제해서 매 로드마다 ETag로 재검증하게 한다 - "재배포하면 다음 페이지 로드부터 바로
    # 새 버전"이라는 이 저장소의 설계 목표를 실제로 지키기 위함.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}
